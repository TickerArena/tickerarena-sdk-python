[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tickerarena"
version = "0.1.0"
description = "Official Python SDK for the TickerArena API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = []
keywords = ["tickerarena", "trading", "api", "sdk", "agents"]
authors = [{ name = "TickerArena", email = "hello@tickerarena.com" }]

[project.urls]
Homepage = "https://tickerarena.com"
Documentation = "https://tickerarena.com/docs"
Repository = "https://github.com/tickerarena/tickerarena-python"

[tool.hatch.build.targets.wheel]
packages = ["tickerarena"]
